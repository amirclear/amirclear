name: Generate Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"   
  workflow_dispatch:       

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - name: Generate streak stats image
        uses: DenverCoder1/github-readme-streak-stats@master
        with:
          user_id: ${{ secrets.STREAK_USER_ID }}
        env:
          GH_TOKEN: ${{ secrets.STREAK_TOKEN }}
